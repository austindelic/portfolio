[package]
name = "tui-renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = { version = "=29.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
pollster = "0.4"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"
anyhow = "1"
tui-core = { path = "../core" }
