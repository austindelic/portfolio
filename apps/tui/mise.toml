[tools]
rust = "latest"

[tasks.dev]
description = "Run the native terminal portfolio"
run = "cargo run -p austindelic"

[tasks.build]
description = "Build the native portfolio"
run = "cargo build --release -p austindelic"

[tasks.assets]
description = "Sync canonical website assets"
run = "node scripts/sync-assets.mjs"

[tasks.check-assets]
run = "node scripts/sync-assets.mjs --check"

[tasks.ssh]
description = "Run the preserved SSH adapter (requires its existing server setup)"
run = "cargo run -p tui-ssh"
