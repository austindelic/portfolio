[package]
name = "austindelic"
version = "0.1.1"
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
tui-core = { path = "../core" }
austindelic-blackhole = "=0.1.0"
glam = "0.30"
serde = { version = "1", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "underline-color", "layout-cache"] }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ctrlc = { version = "3.5", features = ["termination"] }
open = "5.4"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "austindelic"
path = "src/main.rs"

[dev-dependencies]
portable-pty = "0.9"
