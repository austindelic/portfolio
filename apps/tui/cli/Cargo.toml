[package]
name = "austindelic"
version = "0.1.0"
edition = "2024"

[dependencies]
tui-core = { path = "../core" }
tui-renderer = { path = "../renderer" }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
signal-hook = "0.3"
serde_json = "1"
tempfile = "3"

[[bin]]
name = "austindelic"
path = "src/main.rs"
