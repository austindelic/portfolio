[package]
name = "tui-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
textwrap = "0.16"
unicode-width = "0.2"

[build-dependencies]
serde_json = "1"
serde_yaml_ng = "0.10"
