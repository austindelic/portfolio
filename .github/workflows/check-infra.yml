name: Check infrastructure and launcher
on:
  pull_request:
    paths: ['infra/**', 'apps/tui/**', 'apps/portfolio/**', 'packages/black-hole/**', '.github/workflows/**', '.gitattributes']
  push:
    branches: [main]
    paths: ['infra/**', 'apps/tui/**', 'apps/portfolio/**', 'packages/black-hole/**', '.github/workflows/**', '.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    name: Asset sync (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Exercise checkout with automatic line-ending conversion
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test packages/black-hole/tests/*.test.mjs
      - run: node apps/tui/scripts/sync-assets.mjs --check
      - run: git diff --exit-code
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: '1.11.5', tofu_wrapper: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: tofu -chdir=infra fmt -check -recursive
      - run: tofu -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: tofu -chdir=infra validate
      - run: tofu -chdir=infra test
      - run: node --test apps/tui/scripts/tests/npm-launcher.test.cjs
