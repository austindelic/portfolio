name: Check infrastructure and launcher
on:
  pull_request:
    paths: ['infra/**', 'wrangler.jsonc', 'apps/tui/**', 'apps/portfolio/**', 'packages/**', 'tooling/**', 'package.json', 'bun.lock', 'tsconfig.tooling.json', '.github/workflows/**', '.gitattributes']
  push:
    branches: [main]
    paths: ['infra/**', 'wrangler.jsonc', 'apps/tui/**', 'apps/portfolio/**', 'packages/**', 'tooling/**', 'package.json', 'bun.lock', 'tsconfig.tooling.json', '.github/workflows/**', '.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    name: Asset sync (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Exercise checkout with automatic line-ending conversion
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.5" }
      - run: bun install --frozen-lockfile
      - run: node --import tsx apps/tui/scripts/sync-assets.ts --check
      - run: git diff --exit-code
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.5" }
      - run: bun install --frozen-lockfile
      - run: node --import tsx --test infra/tests/hosting.test.ts
      - run: node --import tsx apps/tui/scripts/build-launcher.ts
      - run: node --import tsx --test apps/tui/scripts/tests/npm-launcher.test.ts
  typescript:
    name: TypeScript, browser tooling and production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix apps/tui/release
      - run: bun run check-types
      - run: bun run test:tooling
      - run: bun run lint
      - run: bun run --filter portfolio test:performance
      - run: bun run build
  native:
    name: Native external-library integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev pkg-config
      - name: Install the release Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - run: cargo test --locked --manifest-path apps/tui/Cargo.toml --workspace
      - run: cargo build --locked --manifest-path apps/tui/Cargo.toml -p austindelic --bin austindelic --example pty-smoke
      - run: apps/tui/target/debug/examples/pty-smoke "$GITHUB_WORKSPACE/apps/tui/target/debug/austindelic"
