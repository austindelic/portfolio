name: Release terminal portfolio
on:
  push:
    branches: [main]
    paths:
      - 'apps/tui/**'
      - '.github/workflows/release-tui.yml'
      - '.gitattributes'
      - 'apps/portfolio/src/data/portfolio.json'
      - 'apps/portfolio/src/content/blog/**'
      - 'apps/portfolio/public/resume.pdf'
      - 'apps/portfolio/public/fonts/DepartureMono-Regular.woff2'
      - 'apps/portfolio/src/config/black-hole-routes.json'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify only, publish after verification, or resume a tested release
        type: choice
        options: [verify, publish, recover]
        default: verify
      recovery_run_id:
        description: Original workflow run ID (recover only)
        type: string
concurrency:
  group: tui-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plan:
    if: inputs.mode != 'recover'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # semantic-release also checks push access during dry-run
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.5" }
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix apps/tui/release
      - run: npm test --prefix apps/tui/release
      - run: node --import tsx apps/tui/scripts/build-launcher.ts
      - run: node --import tsx --test apps/tui/scripts/tests/npm-launcher.test.ts
      - id: plan
        run: node --import tsx apps/tui/release/run.ts plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        with: { name: release-plan, path: release-plan.json, if-no-files-found: error }
  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, npm: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64 }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc, npm: win32-x64 }
    runs-on: ${{ matrix.runner }}
    env:
      RUST_TARGET: ${{ matrix.target }}
      NPM_TARGET: ${{ matrix.npm }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.5" }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with: { name: release-plan }
      - run: node --import tsx apps/tui/release/version.ts
      - run: node --import tsx apps/tui/scripts/sync-assets.ts --check
      - run: node --import tsx apps/tui/scripts/build-launcher.ts
      - run: node --import tsx --test apps/tui/scripts/tests/npm-launcher.test.ts
      - name: Build Linux on Debian 12 for a consistent glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e RUST_TARGET -e NPM_TARGET rust:1.96-bookworm bash -c 'apt-get update && apt-get install -y libwayland-dev pkg-config && bash apps/tui/scripts/release-build.sh'
      - name: Build native macOS or Windows executable
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustup target add "$RUST_TARGET"
          if [[ "$RUNNER_OS" == Windows ]]; then export RUSTFLAGS='-C target-feature=+crt-static'; fi
          bash apps/tui/scripts/release-build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.npm }}
          path: release/
          if-no-files-found: error
  package:
    needs: [plan, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.5" }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with: { pattern: 'native-*', path: release, merge-multiple: true }
      - uses: actions/download-artifact@v7
        with: { name: release-plan }
      - run: node --import tsx apps/tui/release/version.ts
      - name: Assemble both registries from identical native binaries
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          cargo fetch --locked --manifest-path apps/tui/Cargo.toml
          python3 apps/tui/scripts/notices.py
          NPM_CLI_JS="$(npm root -g)/npm/bin/npm-cli.js"
          export NPM_CLI_JS
          for registry in npm github; do
            PACK_REGISTRY="$registry" node --import tsx apps/tui/scripts/pack.ts "packed/$registry"
            node --import tsx apps/tui/scripts/check-npm-package.ts "packed/$registry"
            node --import tsx apps/tui/scripts/test-platform-selection.ts "packed/$registry"
          done
          node --import tsx apps/tui/release/bundle.ts
      - uses: actions/upload-artifact@v6
        with: { name: npm-package, path: 'packed/', if-no-files-found: error }
  packed-test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, npm: darwin-arm64 }
          - { runner: macos-15-intel, npm: darwin-x64 }
          - { runner: ubuntu-24.04, npm: linux-x64 }
          - { runner: ubuntu-24.04-arm, npm: linux-arm64 }
          - { runner: windows-2022, npm: win32-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.5" }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: packed }
      - uses: actions/download-artifact@v7
        with: { name: 'native-${{ matrix.npm }}', path: release }
      - name: Test the exact npm tarballs in a real terminal
        timeout-minutes: 5
        shell: bash
        run: |
          NPM_CLI_JS="$(npm root -g)/npm/bin/npm-cli.js"
          if [[ "$RUNNER_OS" == Windows ]]; then
            NPM_CLI_JS="$(node -p "require('node:path').join(require('node:path').dirname(process.execPath), 'node_modules/npm/bin/npm-cli.js')")"
          fi
          export NPM_CLI_JS
          suffix=''; if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          chmod +x release/test/${{ matrix.npm }}/* || true
          for registry in npm github; do
            node --import tsx apps/tui/scripts/test-packed.ts "packed/$registry" "release/test/${{ matrix.npm }}/pty-smoke$suffix"
          done
      - name: Install Linux software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libwayland-client0
      - name: Execute live shader pipeline on Linux software Vulkan or Windows WARP
        if: runner.os != 'macOS'
        shell: bash
        env:
          AUSTINDELIC_SOFTWARE_GPU: '1'
          TUI_RENDER_COLUMNS: '40'
        run: |
          suffix=''; if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          "release/test/${{ matrix.npm }}/probe$suffix"
  tested-bundle:
    needs: packed-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: packed }
      - uses: actions/upload-artifact@v6
        with:
          name: tested-release
          path: packed/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: [plan, tested-bundle]
    if: >-
      github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' &&
      vars.TUI_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.mode == 'publish')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.5" }
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix apps/tui/release
      - uses: actions/download-artifact@v7
        with: { name: tested-release, path: packed }
      - name: Publish tested archives and create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NPM_CLI_JS="$(npm root -g)/npm/bin/npm-cli.js"
          export NPM_CLI_JS
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/tui-npmrc"
          # shellcheck disable=SC2016 # npm expands this variable when reading its config
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          node --import tsx apps/tui/release/run.ts publish
  recover:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'recover' && vars.TUI_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.5" }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: tested-release
          path: packed
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: original
        run: node --import tsx apps/tui/release/recover.ts
        env:
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.original.outputs.sha }}
          fetch-depth: 0
          clean: false
      - run: npm ci --prefix apps/tui/release
      - name: Resume original version without rebuilding
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NPM_CLI_JS="$(npm root -g)/npm/bin/npm-cli.js"
          export NPM_CLI_JS
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/tui-npmrc"
          # shellcheck disable=SC2016 # npm expands this variable when reading its config
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          node --import tsx apps/tui/release/run.ts recover
