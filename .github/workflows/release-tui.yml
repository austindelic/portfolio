name: Release terminal portfolio
on:
  push:
    branches: [main]
    tags: ['tui-v*']
    paths: ['apps/tui/**', 'packages/black-hole/**', '.github/workflows/release-tui.yml', '.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, npm: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64 }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc, npm: win32-x64 }
    runs-on: ${{ matrix.runner }}
    env:
      RUST_TARGET: ${{ matrix.target }}
      NPM_TARGET: ${{ matrix.npm }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test packages/black-hole/tests/*.test.mjs
      - run: node apps/tui/scripts/sync-assets.mjs --check
      - run: node --test apps/tui/scripts/tests/npm-launcher.test.cjs
      - name: Build Linux on Debian 12 for a consistent glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e RUST_TARGET -e NPM_TARGET rust:1.96-bookworm bash -c 'apt-get update && apt-get install -y libwayland-dev pkg-config && bash apps/tui/scripts/release-build.sh'
      - name: Build native macOS or Windows executable
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustup target add "$RUST_TARGET"
          if [[ "$RUNNER_OS" == Windows ]]; then export RUSTFLAGS='-C target-feature=+crt-static'; fi
          bash apps/tui/scripts/release-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.npm }}
          path: release/
          if-no-files-found: error
  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { pattern: 'native-*', path: release, merge-multiple: true }
      - name: Assemble the single public package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/tui-v') && github.ref_name || '' }}
        run: |
          mkdir -p apps/tui/npm/native
          cp -R release/native/. apps/tui/npm/native/
          find apps/tui/npm/native -type f -name austindelic -exec chmod +x {} \;
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          cargo fetch --locked --manifest-path apps/tui/Cargo.toml
          python3 apps/tui/scripts/notices.py
          node apps/tui/scripts/check-npm-package.cjs
          mkdir -p packed
          npm pack ./apps/tui/npm --pack-destination packed
      - uses: actions/upload-artifact@v4
        with: { name: npm-package, path: 'packed/*.tgz', if-no-files-found: error }
  packed-test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, npm: darwin-arm64 }
          - { runner: macos-15-intel, npm: darwin-x64 }
          - { runner: ubuntu-24.04, npm: linux-x64 }
          - { runner: ubuntu-24.04-arm, npm: linux-arm64 }
          - { runner: windows-2022, npm: win32-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: npm-package, path: packed }
      - uses: actions/download-artifact@v4
        with: { name: 'native-${{ matrix.npm }}', path: release }
      - name: Test the exact npm tarball in a real terminal
        timeout-minutes: 2
        shell: bash
        run: |
          export NPM_CLI_JS="$(npm root -g)/npm/bin/npm-cli.js"
          if [[ "$RUNNER_OS" == Windows ]]; then
            export NPM_CLI_JS="$(node -p "require('node:path').join(require('node:path').dirname(process.execPath), 'node_modules/npm/bin/npm-cli.js')")"
          fi
          suffix=''; if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          chmod +x release/test/${{ matrix.npm }}/* || true
          node apps/tui/scripts/test-packed.cjs packed/*.tgz "release/test/${{ matrix.npm }}/pty-smoke$suffix"
      - name: Install Linux software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libwayland-client0
      - name: Execute live shader pipeline on Linux software Vulkan or Windows WARP
        if: runner.os != 'macOS'
        shell: bash
        env:
          AUSTINDELIC_SOFTWARE_GPU: '1'
          TUI_RENDER_COLUMNS: '40'
        run: |
          suffix=''; if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          "release/test/${{ matrix.npm }}/probe$suffix"
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/tui-v')
    needs: packed-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org' }
      - uses: actions/download-artifact@v4
        with: { name: npm-package, path: packed }
      - run: npm install --global npm@11
      - run: npm publish packed/*.tgz --access public --provenance
